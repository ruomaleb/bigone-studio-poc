function askCode(){form('Code de test',[{k:'i',t:'info',l:'La consultation est libre. Pour modifier, saisissez le code fourni par Nanotera, puis recommencez votre action. Le code Responsable permet aussi d\'approuver, de déclarer une remise et de clôturer ; le code Éditeur ne le permet pas.'},{k:'code',l:'Code de test',req:1}],async r=>{let x;try{x=await rpc({p_code:r.code,p_op:'check'})}catch(e){return 'Vérification impossible. Réessayez dans un instant.'}
  if(!x||x.ok!==true)return 'Code refusé. Vérifiez-le puis réessayez.';retenirCode(r.code,x);toast('Modifications activées · '+(NOM||'code accepté')+'.');render();return true},null,render)}
function montant(s,ent){s=String(s??'').replace(/[\s  ]/g,'').replace(/€$/,'');if(s==='')return {v:null};
  if(!(ent?/^\d+$/:/^\d+([.,]\d{1,2})?$/).test(s))return {e:ent?'Saisissez un nombre entier.':'Montant non reconnu. Formats acceptés : 12,5 ou 1 299,90 (deux décimales au plus).'};
  return {v:parseFloat(s.replace(',','.'))}}
const fmtN=v=>v==null?'':String(v).replace('.',',');
function form(titre,champs,ok,suppr,annule){const d=$('#dlg');let fini=false;
  d.innerHTML='<form id="f" novalidate><h2>'+esc(titre)+'</h2><p id="f-err" class="note" role="alert" hidden></p>'+champs.map(c=>{const id='f-'+c.k,v=c.v??'',num=c.t==='number'||c.t==='int';
    if(c.t==='info')return '<p class="small muted" id="'+id+'" style="margin:0">'+c.l+'</p>';
    if(c.t==='check')return '<label class="ck"><input type="checkbox" id="'+id+'"'+(c.v?' checked':'')+'> '+esc(c.l)+'</label>';
    if(c.t==='select')return '<label>'+esc(c.l)+'<select id="'+id+'">'+c.o.map(([k,l])=>'<option value="'+esc(k)+'"'+(String(k)===String(v)?' selected':'')+'>'+esc(l)+'</option>').join('')+'</select></label>';
    if(c.t==='area')return '<label>'+esc(c.l)+'<textarea id="'+id+'" rows="3">'+esc(v)+'</textarea><span class="ferr" id="e-'+c.k+'"></span></label>';
    const suggestions=c.choices?'<datalist id="'+id+'-choices">'+c.choices.map(x=>'<option value="'+esc(x)+'"></option>').join('')+'</datalist>':'';
    return '<label>'+esc(c.l)+'<input '+(c.choices?'list="'+id+'-choices" ':'')+'id="'+id+'" type="'+(num?'text':c.t||'text')+'"'+(num?' inputmode="decimal"':'')+' value="'+esc(num?fmtN(c.v):v)+'">'+suggestions+'<span class="ferr" id="e-'+c.k+'"></span></label>'}).join('')+
    '<div class="row" style="justify-content:space-between"><span>'+(suppr?'<button type="button" class="btn" id="f-del">Supprimer</button>':'')+'</span><span class="row"><button type="button" class="btn" id="f-no">Annuler</button><button class="btn pri" id="f-ok">Enregistrer</button></span></div></form>';
  const mechanics=$('#f-mecaType');
  if(mechanics){
    const initial=mechanics.value;
    const sync=()=>champs.filter(c=>c.when).forEach(c=>{
      const el=$('#f-'+c.k);
      const historical=mechanics.value===initial && c.v!=null && c.v!=='';
      el.disabled=mechanics.value!==c.when && !historical;
      el.closest('label').hidden=el.disabled;
    });
    mechanics.addEventListener('change',sync);
    sync();
  }
  const echec=m=>{const e=$('#f-err');e.textContent=m;e.hidden=false;$('#f-ok').disabled=false;$('#f-ok').textContent='Enregistrer'};
  d.onclose=()=>{d.onclose=null;if(!fini&&annule)annule()};
  $('#f-no').onclick=()=>d.close();
  if(suppr)$('#f-del').onclick=async()=>{if(await suppr()!==false){fini=true;d.close()}else echec('Suppression non effectuée. Réessayez.')};
  $('#f').onsubmit=async e=>{e.preventDefault();const r={};let prem=null;$('#f-err').hidden=true;
    champs.forEach(c=>{if(c.t==='info')return;const el=$('#f-'+c.k),sp=$('#e-'+c.k);let m='';
      if(el.disabled){r[c.k]=c.t==='number'||c.t==='int'?null:'';return}
      if(c.t==='check')r[c.k]=el.checked;
      else if(c.t==='number'||c.t==='int'){const x=montant(el.value,c.t==='int');if(x.e)m=x.e;else if(x.v==null&&c.req)m='Champ obligatoire.';r[c.k]=x.v}
      else{r[c.k]=el.value.trim();if(c.req&&!r[c.k])m='Champ obligatoire.'}
      if(sp){sp.textContent=m;m?el.setAttribute('aria-invalid','true'):el.removeAttribute('aria-invalid');if(m&&!prem)prem=el}});
    if(prem){prem.focus();return}
    const b=$('#f-ok');b.disabled=true;b.textContent='Enregistrement…';let res;try{res=await ok(r)}catch(x){res=false}
    if(res===false||typeof res==='string')return echec(res||'Enregistrement non effectué. Vos saisies sont conservées : réessayez.');
    fini=true;d.close()};
  if(!d.open)d.showModal()}

  if(a==='csv-dispo')return copier(csv([['support','variante','famille','format','ancienne_indication_version','echeance','etat','revision','fichier','magasins','nb_offres','prix_exception'],...supsOf(o.id).map(s=>[s.type,nomVar(s),FAMILLES[typ(s).f],s.format||baseDe(s).format,s.versions,echeance(s,o),enProd(s)?libStat(s.statut):'En préparation',s.rev||1,s.fichier,magsSup(s,o).map(m=>m.nom).join(', '),offresDe(s).length,offresDe(s).filter(p=>s.prixVar&&s.prixVar[p.id]!=null).map(p=>p.libelle+' '+fmtN(s.prixVar[p.id])).join(', ')])]),'Dispositif copié. Collez-le dans un tableur.');
  if(!peutEcrire())return;
  if(a==='new-op')return fOp(null);
  if(!o)return;
  if(d.correction&&!o.cloture)return setStat(sup(d.correction),'corrections');
  if(o.cloture&&a!=='note'&&a!=='rouvrir')return toast('Production clôturée : rouvrez le dossier pour le modifier.');
  if(d.prod)return fProd(S.produits.find(p=>p.id===d.prod));
  if(d.chk)return fChk(sup(d.chk));
  if(d.rev)return fRev(sup(d.rev));
  if(d.supEdit)return fSup(sup(d.supEdit));
  if(d.varNew)return fVar(sup(d.varNew));
  if(d.varEdit){const v=sup(d.varEdit);return fVar(baseDe(v),v)}
  if(d.retro)return fRetro(sup(d.retro));
  if(d.choix)return fChoix(sup(d.choix));
  if(d.chip)return fPlacer(sup(d.sup),d.chip);
  if(d.engsup)return fEngSup(S.magasins.find(m=>m.id===d.engsup));
  if(d.rub){const s=sup(d.sup),pg=pagesDe(s),p=pg.find(x=>x.n===+d.rub);return form('Page '+p.n,[{k:'rubrique',l:'Rubrique',v:p.rubrique},{k:'cases',l:'Nombre de cases',t:'int',v:p.cases,req:1}],r=>ecrirePages(s,pg.map(x=>x.n===p.n?{n:x.n,rubrique:r.rubrique,cases:Math.max(1,r.cases)}:x)))}
  if(d.addpage){const s=sup(d.addpage),pg=pagesDe(s);if(pg.length)return ecrirePages(s,[...pg,{n:pg.length+1,rubrique:'',cases:4}]);
    return form('Créer le chemin de fer',[{k:'n',l:'Nombre de pages',t:'int',v:8,req:1}],r=>r.n<1||r.n>200?'Indiquez entre 1 et 200 pages.':ecrirePages(s,Array.from({length:r.n},(_,i)=>({n:i+1,rubrique:i?'':'Une',cases:i?4:2}))))}
  if(d.ouvrir){const s=sup(d.ouvrir);if(!pretProd(s,o).every(x=>x[0]))return;if(await w('supports/'+s.id,{prod:true,statut:'amonter'})){await jalon(s,'donnees');if(typ(s).pagine)await jalon(s,'cdf');await log(o.id,titre(s)+' ouvert en production : '+(s.institutionnel?'création institutionnelle':offresDe(s).length+' offre(s) sans anomalie bloquante')+(typ(s).pagine?', chemin de fer de '+pagesDe(s).length+' page(s)':'')+'.')}return}
  if(a==='edit-op')return fOp(o);
  if(a==='brief')return fBrief(o);
  if(a==='new-prod')return fProd(null);
  if(a==='import')return fImport();
  if(a==='new-sup')return fSup(null);
  if(a==='new-mag')return form('Ajouter un magasin au réseau '+resOp(o),[{k:'nom',l:'Nom du magasin',req:1},{k:'code',l:'Identifiant du magasin (code point de vente)'}],r=>S.magasins.some(m=>r.code&&m.code===r.code)?'Cet identifiant est déjà utilisé par un autre magasin.':w('magasins/'+uid('m'),{nom:r.nom,code:r.code,reseau:resOp(o),source:null},'set'));
  if(d.mag){const m=S.magasins.find(x=>x.id===d.mag);return form('Fiche magasin',[{k:'i',t:'info',l:'Identifiant interne : '+esc(m.id)},{k:'nom',l:'Nom du magasin',v:m.nom,req:1},{k:'code',l:'Identifiant du magasin (code point de vente)',v:m.code}],r=>S.magasins.some(x=>x.id!==m.id&&r.code&&x.code===r.code)?'Cet identifiant est déjà utilisé par un autre magasin.':w('magasins/'+m.id,{nom:r.nom,code:r.code}))}
  if(a==='note')return form('Note au journal',[{k:'texte',l:'Note',t:'area',req:1}],r=>log(o.id,r.texte));
  if((a==='cloturer'||a==='rouvrir')&&!peutValider())return toast('Votre code Éditeur ne permet pas de clôturer ni de rouvrir un dossier : ces décisions sont réservées au Responsable.');
  if(a==='cloturer'){const ref=refusCloture(o);if(ref.length)return toast('Clôture impossible. '+ref[0]);
    return form('Clôturer la production',[{k:'i',t:'info',l:'La clôture fige le bilan de production et verrouille le dossier. Pour le modifier ensuite, il faudra le rouvrir avec un motif ; le bilan figé sera conservé.'},{k:'note',l:'Enseignements à retenir pour la prochaine opération',t:'area'}],async r=>{const ref2=refusCloture(o);if(ref2.length)return 'Clôture impossible. '+ref2.join(' ');
      if(PUBLIC&&!await charger())return 'Impossible de relire le dossier avant la clôture.';
      const actuelle=opById(o.id);if(!actuelle||actuelle.cloture||actuelle._v!==o._v)return 'Le dossier a changé. Rouvrez le bilan.';
      const motifs=refusCloture(actuelle);if(motifs.length)return motifs.join(' ');
      if(!await w('operations/'+o.id,{cloture:true,bilan:Object.assign(calcBilan(o),{date:today(),note:r.note})}))return false;await log(o.id,'Production clôturée, bilan figé.'+(r.note?' Enseignements : '+r.note:''));return true})}
  if(a==='rouvrir')return form('Rouvrir le dossier',[{k:'i',t:'info',l:'Le bilan figé reste consultable dans les bilans précédents. Le dossier redevient modifiable.'},{k:'motif',l:'Motif de la réouverture',t:'area',req:1}],async r=>{
    if(!await w('operations/'+o.id,{cloture:false,bilan:null,bilansPrecedents:[...(o.bilansPrecedents||[]),Object.assign({},o.bilan||Object.assign(calcBilan(o),{date:today()}),{motifReouverture:r.motif})]}))return false;await log(o.id,'Dossier rouvert. Motif : '+r.motif,'modif');return true})});
// L’état choisi reste stable quand les données ou la vue sont actualisées.
document.addEventListener('toggle',e=>{if(e.target.id==='planning'&&e.target===$('#planning'))planningOpen=e.target.open},true);
document.addEventListener('input',e=>{
  if(e.target.id==='operation-query'){
    operationQuery=e.target.value;
    $('#operation-results').innerHTML=operationResults(sorted().filter(o=>suivi(o)&&!o.cloture));
    return;
  }
  if(e.target.id!=='q-prod')return;qProd=e.target.value;render();const q=$('#q-prod');if(q){q.focus();q.setSelectionRange(qProd.length,qProd.length)}});
document.addEventListener('change',async e=>{const t=e.target,d=t.dataset,o=curOp();
  if(t.id==='priority-filter'){
    priorityFilter=t.value;
    render();
    $('#priority-filter').focus();
    return;
  }
  if(t.id==='admin-reseau'){adminRes=t.value;return render()}
  if(t.id==='filtre-prod'){filtreProd=t.value;return render()}
  if(t.id==='opsel')return aller(d.v,t.value,d.tab);
  if(!(d.task||d.eng||d.stat))return;
  if(!peutEcrire())return render();
  if(o.cloture){toast('Production clôturée : rouvrez le dossier pour le modifier.');return render()}
  if(d.task)return w('taches/'+d.task,{fait:t.checked,faitLe:t.checked?today():null});
  if(d.eng){const m=S.magasins.find(x=>x.id===d.eng),av=eng(o,m);if(!await ecrireEng(o,m,{statut:t.value})){toast('Engagement de '+m.nom+' non enregistré. Réessayez.');return render()}if(supsOf(o.id).some(enProd))await log(o.id,m.nom+' : engagement modifié ('+ENG.find(x=>x[0]===av.statut)[1]+' → '+ENG.find(x=>x[0]===t.value)[1]+').','modif');if(t.value==='engage'&&!av.supports&&basesOf(o.id).length)fEngSup(m);return}
  if(d.stat)return setStat(S.supports.find(s=>s.id===d.stat),t.value)});
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('[data-chip]');if(c)e.dataTransfer.setData('text/plain',c.dataset.chip)});
document.addEventListener('dragover',e=>{const p=e.target.closest&&e.target.closest('[data-page]');if(p){e.preventDefault();p.classList.add('over')}});
document.addEventListener('dragleave',e=>{const p=e.target.closest&&e.target.closest('[data-page]');if(p)p.classList.remove('over')});
document.addEventListener('drop',e=>{const p=e.target.closest&&e.target.closest('[data-page]');if(p){e.preventDefault();if(peutEcrire()&&!curOp().cloture)placer(S.supports.find(s=>s.id===p.dataset.sup),e.dataTransfer.getData('text/plain'),+p.dataset.page)}});
document.querySelector('.skip-link').addEventListener('click',e=>{e.preventDefault();$('#view').focus();$('#view').scrollIntoView({block:'start'})});
window.addEventListener('hashchange',()=>{render();const r=route(),card=r.tab==='dispositif'&&r.context&&Array.from(document.querySelectorAll('[data-support-card]')).find(el=>el.dataset.supportCard===r.context);if(card){card.focus();card.scrollIntoView({block:'center'})}else window.scrollTo({top:0,behavior:'instant'})});
init();
</script>
</body>
