<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BigOne Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Plan : outil de fabrication. Rail de navigation à gauche (barre basse sur mobile), contenu en colonnes denses.
   Neutres froids tirés vers le cyan d'imprimerie, un seul accent magenta, couleurs d'état séparées. */
:root{
  --bg:#f3f6f7; --surface:#ffffff; --ink:#13262c; --muted:#5d7178; --line:#d7e0e3; --rail:#13262c; --rail-ink:#dfe9ec;
  --accent:#c2185b; --accent-ink:#ffffff; --soft:#e8eef0;
  --ok:#1b7f4b; --warn:#a86400; --crit:#c62828; --ok-bg:#e1f3e8; --warn-bg:#fbefd6; --crit-bg:#fbe3e3;
  --display:"Archivo","Arial Narrow",Arial,sans-serif; --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1a1e; --surface:#16272d; --ink:#e6eff1; --muted:#9bb0b7; --line:#2a4047; --rail:#0a1417; --rail-ink:#dfe9ec;
  --accent:#f0669b; --accent-ink:#1a0a11; --soft:#1e343b;
  --ok:#5fd093; --warn:#f0b445; --crit:#ff8a80; --ok-bg:#143325; --warn-bg:#3a2c0d; --crit-bg:#401a1a; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0e1a1e; --surface:#16272d; --ink:#e6eff1; --muted:#9bb0b7; --line:#2a4047; --rail:#0a1417; --rail-ink:#dfe9ec;
  --accent:#f0669b; --accent-ink:#1a0a11; --soft:#1e343b;
  --ok:#5fd093; --warn:#f0b445; --crit:#ff8a80; --ok-bg:#143325; --warn-bg:#3a2c0d; --crit-bg:#401a1a; color-scheme:dark; }
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--body)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:26px;font-weight:800;letter-spacing:-.01em}
h2{font-size:17px;font-weight:700}
h3{font-size:14px;font-weight:700}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:208px 1fr;min-height:100%}
nav{background:var(--rail);color:var(--rail-ink);padding:20px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{font:800 19px var(--display);padding:4px 10px 18px;letter-spacing:.01em}
.brand b{color:#f0669b}
nav a{color:inherit;text-decoration:none;padding:10px;border-radius:6px;font-weight:500;display:flex;gap:10px;align-items:center}
nav a .n{font:700 11px var(--display);opacity:.55;width:16px}
nav a[aria-current="page"]{background:rgba(255,255,255,.1);box-shadow:inset 3px 0 0 #f0669b}
main{padding:24px 28px 60px;min-width:0;display:flex;flex-direction:column;gap:20px;max-width:1280px}
.hd{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.sub{color:var(--muted);margin:2px 0 0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid{display:grid;gap:14px}
.two{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.tiles{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;border-left:4px solid var(--line)}
.tile b{font:800 28px var(--display);display:block;font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:13px}
.tile.warn{border-left-color:var(--warn)} .tile.crit{border-left-color:var(--crit)} .tile.ok{border-left-color:var(--ok)}
.btn{background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:8px 12px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:4px 8px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
select,input,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;max-width:100%}
.pill{display:inline-block;margin:2px 0;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.crit{background:var(--crit-bg);color:var(--crit)}
.pill.src{border:1px dashed var(--line);background:none}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
tr.sel td{background:var(--soft)}
.steps{display:flex;gap:3px}
.steps i{height:6px;flex:1;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--accent)}
.list{display:flex;flex-direction:column}
.list > *{padding:9px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.list > *:last-child{border-bottom:0}
.tl{position:relative;min-width:720px;padding-top:22px}
.tl .ax{position:absolute;top:0;font-size:11px;color:var(--muted);border-left:1px solid var(--line);padding-left:4px;height:100%}
.tl .now{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);z-index:1}
.tl .r{position:relative;height:30px}
.tl .bar{position:absolute;top:4px;height:22px;border-radius:4px;background:var(--soft);border:1px solid var(--muted);font-size:12px;padding:1px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;color:var(--ink)}
.tl .bar.fab{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tl .bar.demo{border-style:dashed}
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.page{border:1px solid var(--line);border-radius:6px;padding:8px;background:var(--bg);min-height:120px;display:flex;flex-direction:column;gap:6px}
.page.over{outline:2px dashed var(--accent)}
.page .pn{font:800 18px var(--display)}
.chip{font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:3px 6px;cursor:grab}
.kan{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;align-items:start}
.col{background:var(--soft);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}
.col h3{display:flex;justify-content:space-between}
.sup{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:6px;font-size:13px}
input[aria-invalid],textarea[aria-invalid]{border-color:var(--crit)}
.ferr{color:var(--crit);font-size:12px;font-weight:400}
.ferr:empty{display:none}
.note{background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:10px 12px;font-size:14px}
.muted{color:var(--muted)} .small{font-size:13px}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:20px;width:min(520px,calc(100vw - 32px));max-height:90vh;overflow:auto}
dialog::backdrop{background:rgba(10,20,23,.55)}
dialog form{display:flex;flex-direction:column;gap:12px}
dialog label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:500}
dialog label.ck{flex-direction:row;align-items:center;gap:8px;font-weight:400;font-size:14px}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:6px;font-size:14px;max-width:calc(100vw - 32px);z-index:9}
#toast:empty{display:none}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  nav{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;padding:6px;z-index:5;justify-content:space-around}
  .brand,nav a .n{display:none}
  nav a{flex-direction:column;font-size:12px;padding:8px 6px;gap:0}
  nav a[aria-current="page"]{box-shadow:inset 0 3px 0 #f0669b}
  main{padding:16px 16px 90px}
  h1{font-size:22px}
}
@media (prefers-reduced-motion:no-preference){ .btn,.bar{transition:border-color .15s} }
</style>
</head>
<body>
<div class="app">
  <nav aria-label="Sections">
    <div class="brand">BigOne <b>Studio</b></div>
    <a href="#accueil"><span class="n">0</span>Accueil</a>
    <a href="#pilotage"><span class="n">1</span>Pilotage</a>
    <a href="#preparation"><span class="n">2</span>Préparation</a>
    <a href="#production"><span class="n">3</span>Production</a>
  </nav>
  <main id="view"></main>
</div>
<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ETAPES=['Cadrage','Données','Chemin de fer','Maquette','BAT','Livraison','Diffusion'];
const STATUTS=[['amonter','À monter'],['maquette','En maquette'],['bat','BAT prêt pour revue'],['corrections','Corrections'],['valide','Approuvé'],['livre','Remis']];
const CHECKS=[['donnees','Prix et libellés conformes aux données'],['mentions','Mentions légales présentes'],['logos','Logos et signature'],['charte','Charte graphique respectée'],['fiche','Conforme à la fiche technique'],['comparaison','PDF de comparaison relu'],['natifs','Fichiers natifs déposés']];
const RAYONS=['Fruits et légumes','Boucherie','Poissonnerie','Crèmerie','Épicerie salée','Épicerie sucrée','Vins et alcools','Entretien','Décoration de Noël','Jouets','Fêtes','Bricolage','Mode','High Tech','Frais','Épicerie'];
const ORIGINE=['Fruits et légumes','Boucherie','Poissonnerie'];
const ENG=[['engage','Engagé'],['attente','En attente'],['non','Non participant']];
const S={operations:[],produits:[],magasins:[],supports:[],taches:[],journal:[],chemins:[],engagements:[]};
let db=null,status='loading',cur=null,timer=null;
try{cur=localStorage.getItem('bos-op')}catch(e){}

/* ---------- dates ---------- */
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>iso(new Date());
const fd=s=>s?pd(s.slice(0,10)).toLocaleDateString('fr-FR',{day:'numeric',month:'short'}):'';
function feries(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=(h+l-7*m+114)%31+1;
  const p=new Date(y,mo-1,da),add=n=>{const x=new Date(p);x.setDate(x.getDate()+n);return iso(x)};
  return [y+'-01-01',add(1),y+'-05-01',y+'-05-08',add(39),add(50),y+'-07-14',y+'-08-15',y+'-11-01',y+'-11-11',y+'-12-25'];}
function ouvre(d){const w=d.getDay();return w!==0&&w!==6&&!feries(d.getFullYear()).includes(iso(d))}
function decale(s,n){const d=pd(s),st=n<0?-1:1;let k=Math.abs(n);while(!ouvre(d))d.setDate(d.getDate()-1);while(k>0){d.setDate(d.getDate()+st);if(ouvre(d))k--}return iso(d)}
/* Règles de rétroplanning proposées : jours ouvrés avant la remise à l'imprimeur, puis avant le début de l'opération. */
function retro(remise,debut){const R=[['Brief et cadrage validés',1,-22],['Données produits reçues',2,-15],['Chemin de fer validé',3,-12],['BAT 1 déposé au client',5,-8],['Retours client sur BAT 1',5,-6],['BAT 2 déposé au client',5,-5],['BAT final validé',5,-2],["Fichiers remis à l'imprimeur",6,0]];
  const t=R.map(([l,e,n])=>({libelle:l,etape:e,echeance:decale(remise,n),fait:false}));
  if(debut){t.push({libelle:'Flux Bonial et Tiendeo déposés',etape:6,echeance:decale(debut,-2),fait:false});t.push({libelle:'E-catalogue mis en ligne',etape:7,echeance:decale(debut,-1),fait:false})}
  return t}

/* ---------- contrôles des données ---------- */
function controles(p){const b=[],a=[];
  if(!p.libelle)b.push('Libellé manquant');
  if(p.prix==null||!(p.prix>0))b.push('Prix manquant');
  if(p.barre!=null&&p.prix!=null&&p.barre<=p.prix)b.push('Prix barré inférieur ou égal au prix');
  if(p.rayon==='Vins et alcools'&&!p.mention)b.push('Mention légale alcool manquante');
  if(ORIGINE.includes(p.rayon)&&!p.origine)b.push('Origine manquante');
  if(!p.rayon)a.push('Rayon non renseigné');
  if(p.page==null)a.push('Non placé dans le chemin de fer');
  return {b,a}}
const prodsOf=id=>S.produits.filter(p=>p.op===id);
const bloquants=id=>prodsOf(id).reduce((n,p)=>n+controles(p).b.length,0);

/* ---------- base de données ---------- */
function toast(m){$('#toast').textContent=m;clearTimeout(toast.t);toast.t=setTimeout(()=>$('#toast').textContent='',4000)}
const SB='https://etmuhdohnalwxlqhsfnf.supabase.co',KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV0bXVoZG9obmFsd3hscWhzZm5mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ2NDUxMzUsImV4cCI6MjExMDIyMTEzNX0.Jiy4H8jHLm3ykZF-673Lu_RGyhEc9YDre9LitZ6w5tg',HD={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};
let CODE=null;try{CODE=localStorage.getItem('bos-code')}catch(e){}
const rpc=async b=>{const r=await fetch(SB+'/rest/v1/rpc/studio_write',{method:'POST',headers:HD,body:JSON.stringify(b)});if(!r.ok)throw new Error('rpc');return r.json()};
async function w(path,data,mode){if(!CODE){toast('Saisissez le code de test pour modifier.');return false}
  const [col,id]=path.split('/'),op=mode==='set'?'set':mode==='delete'?'delete':'update';
  try{const ok=await rpc({p_code:CODE,p_op:op,p_col:col,p_id:id,p_data:data||{}});
    if(ok!==true){CODE=null;try{localStorage.removeItem('bos-code')}catch(e){}toast('Code refusé. Saisissez-le à nouveau.');schedule();return false}
    const a=S[col],i=a.findIndex(x=>x.id===id);if(op==='delete'){if(i>=0)a.splice(i,1)}else if(op==='set'){const d=Object.assign({id},data);if(i>=0)a[i]=d;else a.push(d)}else if(i>=0)a[i]=Object.assign({},a[i],data);
    schedule();return true}
  catch(e){toast('Enregistrement impossible. Réessayez dans un instant.');return false}}
const uid=p=>p+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const log=(op,texte)=>w('journal/'+uid('j'),{op,date:new Date().toISOString().slice(0,16),texte},'set');
let raf=0;function schedule(){if(!raf)raf=requestAnimationFrame(()=>{raf=0;render()})}
async function charger(){try{const r=await fetch(SB+'/rest/v1/docs?select=col,id,data&order=col,id',{headers:HD});if(!r.ok)throw 0;const rows=await r.json(),N={},sig=JSON.stringify(rows);if(sig===charger.sig&&status==='ok')return;charger.sig=sig;Object.keys(S).forEach(k=>N[k]=[]);
    rows.forEach(x=>{if(N[x.col])N[x.col].push(Object.assign({id:x.id},x.data))});Object.assign(S,N);status='ok'}catch(e){if(status!=='ok')status='err'}schedule()}
async function init(){render();await charger();setInterval(()=>{if(!document.hidden&&!$('#dlg').open)charger()},20000)}

/* ---------- composants ---------- */
const opById=id=>S.operations.find(o=>o.id===id);
const sorted=()=>[...S.operations].sort((a,b)=>(a.debut||'').localeCompare(b.debut||''));
function curOp(){let o=opById(cur);if(!o){o=sorted().find(x=>x.etape<6)||sorted()[0];cur=o?o.id:null}return o}
const src=s=>s==='public'?'<span class="pill src" title="Relevé sur les sites publics le 14/11/2026">Relevé public</span>':s==='demo'?'<span class="pill src">Démo</span>':s==='drive'?'<span class="pill src">Drive</span>':s==='matrice'?'<span class="pill src">Matrice</span>':'';
const steps=e=>'<div class="steps" title="'+esc(ETAPES[e-1])+'">'+ETAPES.map((_,i)=>'<i class="'+(i<e?'on':'')+'"></i>').join('')+'</div>';
const periode=o=>fd(o.debut)+' → '+fd(o.fin);
function opSelect(){const f=sorted().filter(o=>o.etape<6),d=sorted().filter(o=>o.etape>=6),opt=o=>'<option value="'+esc(o.id)+'"'+(o.id===cur?' selected':'')+'>'+esc(o.nom)+' ('+periode(o)+')</option>';
  return '<select id="opsel" aria-label="Opération">'+(f.length?'<optgroup label="En fabrication">'+f.map(opt).join('')+'</optgroup>':'')+(d.length?'<optgroup label="Livrées ou diffusées">'+d.map(opt).join('')+'</optgroup>':'')+'</select>'}
function banner(){if(status==='ok')return CODE?'':'<div class="note row" style="justify-content:space-between"><span>Prototype en consultation libre, données de démonstration. Un code de test est nécessaire pour modifier.</span><button class="btn sm" data-act="code">Saisir le code</button></div>';
  const m={loading:'Chargement des données…',slow:"Les données ne répondent pas encore. La page se mettra à jour dès qu'elles arrivent.",nodb:"La base de données n'est pas accessible dans cette vue. Ouvrez la page connecté à votre compte Claude.",err:"La base de données ne répond pas. Rechargez la page pour réessayer."}[status];
  return '<div class="note">'+m+'</div>'}
function vide(t){return '<p class="muted">'+t+'</p>'}

/* ---------- vues ---------- */
function vAccueil(){const t=today(),ops=sorted(),fab=ops.filter(o=>o.etape<6),enc=ops.filter(o=>o.debut<=t&&o.fin>=t);
  const bat=S.supports.filter(s=>s.statut==='bat'),ano=fab.reduce((n,o)=>n+bloquants(o.id),0),ret=S.taches.filter(x=>!x.fait&&x.echeance<t&&opById(x.op));
  const todo=[...ret.map(x=>({c:'crit',t:'Tâche en retard',d:x.libelle+' (échéance '+fd(x.echeance)+')',op:x.op,h:'pilotage'})),
    ...fab.filter(o=>bloquants(o.id)).map(o=>({c:'crit',t:bloquants(o.id)+' anomalie(s) bloquante(s)',d:'Données produits à corriger',op:o.id,h:'preparation'})),
    ...bat.map(s=>({c:'warn',t:'BAT '+s.bat+' prêt pour revue',d:s.type,op:s.op,h:'production'})),
    ...S.supports.filter(s=>s.perime&&opById(s.op)).map(s=>({c:'crit',t:s.statut==='livre'?'Nouvelle révision requise':'Support à revalider',d:s.type+' : '+(s.perimeMotif||''),op:s.op,h:'production'})),
    ...S.supports.filter(s=>s.statut==='corrections').map(s=>({c:'warn',t:'Corrections en cours',d:s.type,op:s.op,h:'production'}))];
  const jr=[...S.journal].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6);
  return '<div class="hd"><div><h1>Accueil</h1><p class="sub">'+new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'</p></div></div>'+banner()+
  '<div class="grid tiles"><div class="tile ok"><b>'+enc.length+'</b><span>opérations en diffusion</span></div><div class="tile"><b>'+fab.length+'</b><span>en fabrication</span></div><div class="tile '+(bat.length?'warn':'')+'"><b>'+bat.length+'</b><span>BAT prêts pour revue</span></div><div class="tile '+(ano?'crit':'ok')+'"><b>'+ano+'</b><span>anomalies bloquantes</span></div><div class="tile '+(ret.length?'crit':'ok')+'"><b>'+ret.length+'</b><span>tâches en retard</span></div></div>'+
  '<div class="grid two"><section class="card"><h2>À traiter</h2><div class="list">'+(todo.map(x=>{const o=opById(x.op);return '<a href="#'+x.h+'" data-go="'+esc(x.op)+'" style="color:inherit;text-decoration:none"><span><span class="pill '+x.c+'">'+esc(x.t)+'</span><br>'+esc(x.d)+'<br><span class="muted small">'+esc(o?o.nom:'')+'</span></span><span aria-hidden="true">›</span></a>'}).join('')||vide('Rien à traiter.'))+'</div></section>'+

    '<div class="row" style="justify-content:space-between"><span>'+(suppr?'<button type="button" class="btn" id="f-del">Supprimer</button>':'')+'</span><span class="row"><button type="button" class="btn" id="f-no">Annuler</button><button class="btn pri" id="f-ok">Enregistrer</button></span></div></form>';

/* Recalcul sans suppression : les tâches existantes gardent leur identifiant, leur état et leurs ajouts manuels. */
function planRetro(id,remise,debut){const ex=S.taches.filter(t=>t.op===id),maj=[],crea=[];
  retro(remise,debut).forEach(t=>{const e=ex.find(x=>x.libelle===t.libelle);if(!e)crea.push(t);else if(e.echeance!==t.echeance)maj.push({id:e.id,libelle:e.libelle,de:e.echeance,a:t.echeance})});return {maj,crea}}

  for(const t of p.crea)if(!await w('taches/'+uid('t'),Object.assign({op:id},t),'set'))return false;return true}

/* Une donnée modifiée périme les contrôles des supports déjà en revue, approuvés ou remis. */
async function perimer(opId,motif){const ss=S.supports.filter(s=>s.op===opId&&FIGE.includes(s.statut)&&!s.perime);
  for(const s of ss)await w('supports/'+s.id,s.statut==='livre'?{perime:true,perimeMotif:motif}:{perime:true,perimeMotif:motif,statut:'corrections',checks:Object.assign({},s.checks,{donnees:false,comparaison:false})});
  await log(opId,motif+(ss.length?' '+ss.length+' support(s) à revalider ; les revues et approbations en cours repassent en corrections.':''))}
const CHAMPS={libelle:'libellé',description:'description',marque:'marque',rayon:'rayon',prix:'prix',barre:'prix barré',mecanique:'mécanique',origine:'origine',mention:'mention légale',page:'page'};
const prixTxt=v=>v==null?'aucun':v.toFixed(2).replace('.',',')+' €';
function fProd(p){const o=curOp(),ch=S.chemins.find(c=>c.id===o.id),pg=[['','Non placé'],...(ch?ch.pages:[]).map(x=>[x.n,'Page '+x.n+' · '+(x.rubrique||'')])];
  form(p?'Modifier le produit':'Ajouter un produit',[{k:'libelle',l:'Libellé',v:p&&p.libelle,req:1},{k:'description',l:'Description',t:'area',v:p&&p.description},{k:'marque',l:'Marque',v:p&&p.marque},{k:'rayon',l:'Rayon',t:'select',o:[['','—'],...[...new Set([...RAYONS,...(p&&p.rayon?[p.rayon]:[])])].map(x=>[x,x])],v:p&&p.rayon},{k:'prix',l:'Prix (€)',t:'number',v:p&&p.prix},{k:'barre',l:'Prix barré (€)',t:'number',v:p&&p.barre},{k:'mecanique',l:'Mécanique',v:p?p.mecanique:'Prix bas'},{k:'origine',l:'Origine',v:p&&p.origine},{k:'mention',l:'Mention légale',v:p&&p.mention},{k:'page',l:'Page',t:'select',o:pg,v:p&&p.page!=null?p.page:''}],async r=>{
    r.page=r.page===''?null:+r.page;
    if(!p){if(!await w('produits/'+uid('p'),Object.assign(r,{op:o.id,source:null}),'set'))return false;await perimer(o.id,'Produit « '+r.libelle+' » ajouté.');return true}
    const ch=Object.keys(CHAMPS).filter(k=>(p[k]??'')!==(r[k]??''));if(!ch.length)return true;
    if(!await w('produits/'+p.id,r))return false;
    await perimer(o.id,ch.includes('prix')?'Prix de « '+r.libelle+' » modifié ('+prixTxt(p.prix)+' → '+prixTxt(r.prix)+').':'Fiche de « '+r.libelle+' » modifiée ('+ch.map(k=>CHAMPS[k]).join(', ')+').');return true},
    p&&(async()=>{if(!await w('produits/'+p.id,null,'delete'))return false;await perimer(o.id,'Produit « '+p.libelle+' » supprimé.')}))}
function fSup(){const o=curOp();form('Ajouter un support',[{k:'type',l:'Type',t:'select',o:['Prospectus','E-catalogue','Flux Bonial','Flux Tiendeo','Affiche','PLV','Bannières Meta','Bannières display','SMS / RCS'].map(x=>[x,x])},{k:'format',l:'Format'},{k:'versions',l:'Versions'}],r=>w('supports/'+uid('s'),Object.assign(r,{op:o.id,statut:'amonter',bat:0,checks:{},source:null}),'set'))}
const FIGE=['bat','valide','livre'],libStat=k=>STATUTS.find(x=>x[0]===k)[1],sansCoche=()=>Object.fromEntries(CHECKS.map(([k])=>[k,false]));
function fChk(s){const rem=s.statut==='livre',fige=FIGE.includes(s.statut),arch=(s.archives||[]).map(a=>'rév. '+a.rev+' '+esc(a.etat)+' (« '+esc(a.fichier||'sans fichier')+' »)').join(', ');
  form(s.type+' : contrôles et fiche',[{k:'i0',t:'info',l:'Révision '+(s.rev||1)+(arch?' · historique : '+arch:'')+(fige?'<br>Statut « '+libStat(s.statut)+' » : le fichier, le format et les versions ne changent que par une nouvelle révision.':'')},
    ...(s.perime?[{k:'i',t:'info',l:'<span class="pill crit">'+(rem?'Nouvelle révision requise':'À revalider')+'</span> '+esc(s.perimeMotif||'')+' '+(rem?'Cette révision reste remise telle quelle. Créez une nouvelle révision pour intégrer la modification.':'Recochez « Prix et libellés » et « PDF de comparaison » après vérification.')}]:[]),
    ...CHECKS.map(([k,l])=>({k,l,t:'check',v:s.checks&&s.checks[k]})),{k:'_mode',l:'Mode de validation',t:'select',o:[['client','Revue client (BAT)'],['interne','Approbation interne, sans revue client']],v:s.mode||'client'},{k:'_fichier',l:'Fichier de la révision (nom ou lien)',v:s.fichier},{k:'_dest',l:'Destinataire de la revue',v:s.destinataire},{k:'_format',l:'Format',v:s.format},{k:'_versions',l:'Versions',v:s.versions}],async r=>{
    const checks={},av=s.checks||{};CHECKS.forEach(([k])=>checks[k]=r[k]);
    const chgC=CHECKS.some(([k])=>!!av[k]!==checks[k]),chgF=(s.fichier||'')!==r._fichier||(s.format||'')!==r._format||(s.versions||'')!==r._versions,chgA=(s.destinataire||'')!==r._dest||(s.mode||'client')!==r._mode;
    if(!chgC&&!chgF&&!chgA)return true;
    if(rem)return 'Ce support est remis : sa fiche et ses contrôles sont figés. Créez une nouvelle révision pour le modifier.';
    if(fige&&(chgF||chgA))return 'Pendant la revue et après approbation, le fichier, le format, les versions, le destinataire et le mode de validation sont figés. Créez une nouvelle révision.';
    const d={checks,fichier:r._fichier,destinataire:r._dest,format:r._format,versions:r._versions,mode:r._mode},lever=s.perime&&checks.donnees&&checks.comparaison&&(!av.donnees||!av.comparaison);if(lever){d.perime=false;d.perimeMotif=''}
    if(!await w('supports/'+s.id,d))return false;if(lever)await log(s.op,s.type+' : données revérifiées sur la révision '+(s.rev||1)+' après modification.');return true},rem?null:()=>w('supports/'+s.id,null,'delete'))}
function fRev(s){const n0=s.rev||1;form(s.type+' : nouvelle révision',[{k:'i',t:'info',l:'La révision '+n0+' (« '+esc(s.fichier||'sans fichier')+' », '+esc(libStat(s.statut).toLowerCase())+') et ses décisions restent dans l\'historique. La nouvelle révision repart en maquette, tous contrôles à refaire.'},{k:'fichier',l:'Fichier de la nouvelle révision (nom ou lien)',req:1},{k:'format',l:'Format',v:s.format},{k:'versions',l:'Versions',v:s.versions}],async r=>{
    if(r.fichier===(s.fichier||''))return 'Indiquez un fichier différent de celui de la révision '+n0+'.';
    const etat=libStat(s.statut).toLowerCase(),archives=[...(s.archives||[]),{rev:n0,fichier:s.fichier||'',format:s.format||'',etat,date:today(),destinataire:s.destinataire||'',remiseA:s.remiseA||''}];
    if(!await w('supports/'+s.id,{rev:n0+1,archives,fichier:r.fichier,format:r.format,versions:r.versions,statut:'maquette',checks:sansCoche(),perime:false,perimeMotif:'',remiseA:''}))return false;
    await log(s.op,s.type+' : révision '+(n0+1)+' créée (« '+r.fichier+' »), à contrôler. La révision '+n0+' reste « '+etat+' » dans l\'historique.');return true})}
function refusStat(s,to){const ck=s.checks||{},n=bloquants(s.op);
  if(s.statut==='livre')return 'ce support est remis. Créez une nouvelle révision pour le faire évoluer.';
  if(to!=='valide'&&to!=='livre')return '';
  if(to==='livre'&&s.statut!=='valide')return 'le support doit d\'abord être approuvé.';
  if(!CHECKS.filter(([k])=>k!=='natifs').every(([k])=>ck[k]))return 'terminez les contrôles du support.';
  if(!s.fichier)return 'aucun fichier de révision n\'est renseigné dans la fiche du support.';
  if(s.perime)return 'les données ont changé depuis les contrôles. Revérifiez le support.';
  if(n)return n+' anomalie(s) bloquante(s) restent dans les données de l\'opération.';
  if(to==='valide'&&(s.mode||'client')==='client'){if(s.statut!=='bat')return 'en revue client, le support doit d\'abord passer par « BAT prêt pour revue ». Pour valider sans le client, choisissez « Approbation interne » dans la fiche.';if(!s.destinataire)return 'aucun destinataire de revue n\'est renseigné.'}
  if(to==='livre'&&!ck.natifs)return 'les fichiers natifs ne sont pas déposés.';
  return ''}
async function setStat(s,to){const rv='révision '+(s.rev||1)+' « '+(s.fichier||'')+' »';
  const refus=refusStat(s,to);if(refus){toast((to==='livre'?'Remise':to==='valide'?'Approbation':'Changement')+' impossible : '+refus);return render()}
  if(to==='bat')return form('BAT prêt pour revue',[{k:'i',t:'info',l:'Le prototype n\'envoie rien. Cette action enregistre qu\'une révision est prête à être transmise au client.'},{k:'fichier',l:'Fichier de la révision (nom ou lien)',v:s.fichier,req:1},{k:'dest',l:'Destinataire de la revue',v:s.destinataire,req:1}],async r=>{const n=(s.bat||0)+1;
    if(!await w('supports/'+s.id,{statut:'bat',bat:n,fichier:r.fichier,destinataire:r.dest}))return false;
    await log(s.op,s.type+' : BAT '+n+' prêt pour revue (révision '+(s.rev||1)+' « '+r.fichier+' », destinataire '+r.dest+'). Aucun envoi effectué par le prototype.');return true},null,render);
  if(to==='livre')return form('Remise déclarée',[{k:'i',t:'info',l:'Le prototype ne transmet aucun fichier et ne reçoit aucun reçu. Cette action enregistre une déclaration de remise pour la '+esc(rv)+'.'},{k:'a',l:'Destinataire ou canal de remise',req:1}],async r=>{
    if(!await w('supports/'+s.id,{statut:'livre',remiseA:r.a}))return false;await log(s.op,s.type+' : '+rv+' déclarée remise à '+r.a+'. Aucun reçu : le prototype ne transmet pas de fichier.');return true},null,render);
  if(await w('supports/'+s.id,{statut:to}))await log(s.op,s.type+' : '+(to==='valide'?rv+((s.mode||'client')==='client'?' déclarée approuvée après revue de '+s.destinataire+'.':' approuvée en interne, sans revue client.'):'passé à « '+libStat(to)+' ».'));else render()}
async function setPage(pid,n){const p=S.produits.find(x=>x.id===pid);if(p&&p.page!==n&&await w('produits/'+pid,{page:n}))await perimer(p.op,'« '+p.libelle+' » déplacé (page '+(p.page??'—')+' → '+n+').')}
function prerequis(o){const ps=prodsOf(o.id),ss=S.supports.filter(s=>s.op===o.id);return [[ps.length>0||ss.length>0,'Au moins un produit ou un support défini'],[bloquants(o.id)===0,'Aucune anomalie bloquante dans les données'],[!!o.debut&&!!o.fin&&o.fin>=o.debut,'Période de l\'opération cohérente']]}

/* ---------- import d'une matrice Excel ou CSV ---------- */
const norm=s=>String(s??'').trim().toLowerCase();
const nombre=v=>{if(v==null||v==='')return null;if(typeof v==='number')return v>=0?Math.round(v*100)/100:NaN;const x=montant(v);return x.e?NaN:x.v};
function lireMatrice(A){const CL=[['barre',/barr/],['prix',/prix|tarif/],['libelle',/titre|libell|d[ée]signation|produit|nom/],['description',/descr/],['marque',/marque/],['rayon',/rayon|cat[ée]gor|famille/],['origine',/origine/],['mention',/mention/],['mecanique',/m[ée]canique|offre/]];
  let h=-1,map={};for(let i=0;i<Math.min(A.length,10)&&h<0;i++){const m={};(A[i]||[]).forEach((c,j)=>{const k=CL.find(([k,re])=>re.test(norm(c))&&!(k in m));if(k)m[k[0]]=j});if(m.libelle!=null&&Object.keys(m).length>=2){h=i;map=m}}
  if(h<0)return [];if(map.rayon==null&&!Object.values(map).includes(0))map.rayon=0;
  const g=(r,k)=>map[k]==null||r[map[k]]==null?'':String(r[map[k]]).trim();
  return A.slice(h+1).filter(r=>r&&g(r,'libelle')).map(r=>({libelle:g(r,'libelle'),description:g(r,'description'),marque:g(r,'marque'),rayon:g(r,'rayon'),prix:nombre(map.prix==null?null:r[map.prix]),barre:nombre(map.barre==null?null:r[map.barre]),mecanique:g(r,'mecanique'),origine:g(r,'origine'),mention:g(r,'mention'),page:null}))}
function fImport(){const o=curOp(),d=$('#dlg');let rows=[];d.onclose=null;
  d.innerHTML='<form id="f"><h2>Importer une matrice</h2><p class="muted small" style="margin:0">Fichier Excel ou CSV avec une ligne de titres : Titre, Description, Marque, Prix. Une première colonne sans titre reconnu sert de rayon. Les produits déjà présents dans l\'opération sont ignorés.</p><label>Fichier<input type="file" id="f-file" accept=".xlsx,.xls,.csv"></label><p id="f-info" class="small" style="margin:0"></p><div class="row" style="justify-content:flex-end"><button type="button" class="btn" id="f-no">Annuler</button><button class="btn pri" id="f-ok" disabled>Importer</button></div></form>';
  $('#f-no').onclick=()=>d.close();
  $('#f-file').onchange=async e=>{const f=e.target.files[0],info=$('#f-info');rows=[];$('#f-ok').disabled=true;if(!f)return;
    if(!window.XLSX){info.textContent="Le lecteur de fichiers n'a pas pu se charger. Rechargez la page puis réessayez.";return}
    try{const wb=XLSX.read(await f.arrayBuffer()),all=lireMatrice(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:null}));
      if(!all.length){info.textContent='Aucun produit trouvé. Vérifiez que la première feuille contient une ligne de titres avec au moins « Titre » et « Prix ».';return}
      const ex=new Set(prodsOf(o.id).map(p=>norm(p.libelle)));rows=all.filter(r=>!ex.has(norm(r.libelle)));
      let ill=0;rows.forEach(r=>['prix','barre'].forEach(k=>{if(Number.isNaN(r[k])){r[k]=null;if(k==='prix')ill++}}));
      const sp=rows.filter(r=>r.prix==null).length;info.textContent=rows.length+' produit(s) à importer dans « '+o.nom+' »'+(all.length-rows.length?', '+(all.length-rows.length)+' doublon(s) ignoré(s)':'')+(sp?', dont '+sp+' sans prix'+(ill?' ('+ill+' prix illisible(s), à corriger après import)':''):'')+'.';$('#f-ok').disabled=!rows.length}
    catch(x){info.textContent="Ce fichier n'a pas pu être lu. Enregistrez-le au format .xlsx ou .csv puis réessayez."}};
  $('#f').onsubmit=async e=>{e.preventDefault();const b=$('#f-ok');b.disabled=true;b.textContent='Import en cours…';let n=0;for(const r of rows){if(await w('produits/'+uid('p'),Object.assign(r,{op:o.id,source:'matrice'}),'set'))n++;else break}
    d.close();if(n)await perimer(o.id,n+' produit(s) importé(s) depuis une matrice'+(n<rows.length?' sur '+rows.length+' prévus : import interrompu':'')+'.');toast(n<rows.length?'Import interrompu : '+n+' produit(s) enregistré(s) sur '+rows.length+'.':n+' produit(s) importé(s).')};
  d.showModal()}

/* ---------- événements ---------- */
document.addEventListener('click',async e=>{const t=e.target.closest('[data-act],[data-pick],[data-go],[data-prod],[data-chk],[data-rev],[data-rub]');if(!t)return;const o=curOp(),d=t.dataset,a=d.act;
  if(d.pick)return pick(d.pick);
  if(d.go){cur=d.go;try{localStorage.setItem('bos-op',cur)}catch(x){}return}
  if(a==='code')return askCode();
  if(a==='csv'){const L=[['libelle','description','marque','rayon','prix','prix_barre','mecanique','origine','mention','page'],...prodsOf(o.id).map(p=>[p.libelle,p.description,p.marque,p.rayon,fmtN(p.prix),fmtN(p.barre),p.mecanique,p.origine,p.mention,p.page])].map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(';')).join('\n');
    try{await navigator.clipboard.writeText(L);toast('Données copiées. Collez-les dans un tableur.')}catch(x){toast('Copie refusée par le navigateur.')}return}
  if(!peutEcrire())return;
  if(d.prod)return fProd(S.produits.find(p=>p.id===d.prod));
  if(d.chk)return fChk(S.supports.find(s=>s.id===d.chk));
  if(d.rev)return fRev(S.supports.find(s=>s.id===d.rev));
  if(d.rub){const ch=S.chemins.find(c=>c.id===o.id),p=ch.pages.find(x=>x.n===+d.rub);return form('Page '+p.n,[{k:'rubrique',l:'Rubrique',v:p.rubrique},{k:'cases',l:'Nombre de cases',t:'int',v:p.cases,req:1}],r=>w('chemins/'+o.id,{pages:ch.pages.map(x=>x.n===p.n?{n:x.n,rubrique:r.rubrique,cases:Math.max(1,r.cases)}:x)}))}
  if(a==='new-op')return fOp(null);
  if(!o)return;
  if(a==='edit-op')return fOp(o);
  if(a==='retro')return fRetro(o);
  if(a==='new-prod')return fProd(null);
  if(a==='import')return fImport();
  if(a==='new-sup')return fSup();
  if(a==='note')return form('Note au journal',[{k:'texte',l:'Note',t:'area',req:1}],r=>log(o.id,r.texte));
  if(a==='add-page'){const ch=S.chemins.find(c=>c.id===o.id);if(ch)return w('chemins/'+o.id,{pages:[...ch.pages,{n:ch.pages.length+1,rubrique:'',cases:4}]});
    return form('Créer le chemin de fer',[{k:'n',l:'Nombre de pages',t:'int',v:8,req:1}],r=>r.n<1||r.n>200?'Indiquez entre 1 et 200 pages.':w('chemins/'+o.id,{pages:Array.from({length:r.n},(_,i)=>({n:i+1,rubrique:i?'':'Une',cases:i?4:2}))},'set'))}
  if(a==='to-prod'){if(!prerequis(o).every(x=>x[0]))return;const ps=prodsOf(o.id),ch=S.chemins.find(c=>c.id===o.id),ns=S.supports.filter(s=>s.op===o.id).length;
    if(await w('operations/'+o.id,{etape:4}))await log(o.id,'Passage en production : '+ps.length+' produit(s) sans anomalie bloquante, '+(ch&&ch.pages.length?'chemin de fer de '+ch.pages.length+' page(s)':'sans chemin de fer')+', '+ns+' support(s) défini(s).')}});
document.addEventListener('change',async e=>{const t=e.target,d=t.dataset,o=curOp();
  if(t.id==='opsel')return pick(t.value);
  if(!(d.task||d.eng||d.stat))return;
  if(!peutEcrire())return render();
  if(d.task)return w('taches/'+d.task,{fait:t.checked});
  if(d.eng){const ex=S.engagements.find(x=>x.id===o.id);return w('engagements/'+o.id,{[d.eng]:t.value},ex?undefined:'set')}
  if(d.stat)return setStat(S.supports.find(s=>s.id===d.stat),t.value)});
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('[data-chip]');if(c)e.dataTransfer.setData('text/plain',c.dataset.chip)});
document.addEventListener('dragover',e=>{const p=e.target.closest&&e.target.closest('[data-page]');if(p){e.preventDefault();p.classList.add('over')}});
document.addEventListener('dragleave',e=>{const p=e.target.closest&&e.target.closest('[data-page]');if(p)p.classList.remove('over')});
document.addEventListener('drop',e=>{const p=e.target.closest&&e.target.closest('[data-page]');if(p){e.preventDefault();if(peutEcrire())setPage(e.dataTransfer.getData('text/plain'),+p.dataset.page)}});
window.addEventListener('hashchange',render);
function askCode(){form('Code de test',[{k:'i',t:'info',l:'La consultation est libre. Pour modifier, saisissez le code fourni par Nanotera, puis recommencez votre action.'},{k:'code',l:'Code de test',req:1}],async r=>{let ok;try{ok=await rpc({p_code:r.code,p_op:'check'})}catch(e){return 'Vérification impossible. Réessayez dans un instant.'}
  if(ok!==true)return 'Code refusé. Vérifiez-le puis réessayez.';CODE=r.code;try{localStorage.setItem('bos-code',CODE)}catch(e){}toast('Modifications activées.');render();return true},null,render)}
init();
